<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Setup Tracker</title>
<style>
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-card-hover: #334155;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-light: #7dd3fc;
  --border: #334155;
  --danger: #f87171;
  --success: #4ade80;
  --warning: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}
.app {
  max-width: 800px;
  margin: 0 auto;
  padding: 16px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
h1 { font-size: 1.25rem; color: var(--accent); }
.nav {
  display: flex;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  overflow-x: auto;
}
.nav-item {
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  color: var(--text-muted);
  transition: all 0.2s;
}
.nav-item:hover, .nav-item.active {
  background: var(--bg-card);
  color: var(--accent);
}
.card {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.card:hover { background: var(--bg-card-hover); }
.card-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-icon { font-size: 1.5rem; }
.card-body { flex: 1; }
.card-title { font-weight: 600; }
.card-subtitle { font-size: 0.875rem; color: var(--text-muted); }
.card-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--bg);
  font-size: 0.75rem;
  color: var(--accent);
  margin-top: 4px;
}
.card-chevron { color: var(--text-muted); font-size: 1.25rem; }
.empty-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; }
.btn {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.9; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-secondary { background: var(--bg-card-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: white; }
.btn-full { width: 100%; margin-top: 8px; }
.form-group { margin-bottom: 16px; }
label {
  display: block;
  margin-bottom: 4px;
  font-size: 0.875rem;
  color: var(--text-muted);
}
input, select, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.9rem;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}
textarea { min-height: 80px; resize: vertical; }
.hidden { display: none !important; }
.spec-table {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.spec-table h3 {
  color: var(--accent);
  margin-bottom: 12px;
  font-size: 1rem;
}
.spec-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.spec-row:last-child { border-bottom: none; }
.spec-label { color: var(--text-muted); }
.spec-value { font-weight: 500; }
.setup-detail-header { margin-bottom: 16px; }
.setup-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 8px 0;
  font-size: 0.875rem;
  color: var(--text-muted);
}
.rating-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.875rem;
  font-weight: 600;
}
.r1 { background: #f44336; color: white; }
.r2 { background: #ff9800; color: white; }
.r3 { background: #ffc107; color: black; }
.r4 { background: #4caf50; color: white; }
.r5 { background: #2196f3; color: white; }
.action-bar {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.photo-thumb {
  width: 100%;
  height: 100px;
  object-fit: cover;
  border-radius: 8px;
}
.compare-section { margin-bottom: 16px; }
.compare-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.compare-row.diff { background: rgba(56, 189, 248, 0.1); }
.compare-setup-name { font-size: 0.75rem; margin-bottom: 2px; }
.rating-input { display: flex; gap: 4px; }
.rating-input .star {
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--text-muted);
  transition: color 0.2s;
}
.rating-input .star.active { color: var(--warning); }
</style>
</head>
<body>
<div class="app">
  <header>
    <button id="back-btn" class="btn btn-secondary hidden">← Tillbaka</button>
    <h1 id="page-title">RC Setup Tracker</h1>
    <button id="add-btn" class="btn btn-primary">+ Ny</button>
  </header>

  <nav class="nav">
    <div class="nav-item active" data-view="models">Modeller</div>
    <div class="nav-item" data-view="all-setups">Alla Setups</div>
    <div class="nav-item" data-view="compare">Jämför</div>
    <div class="nav-item" data-view="tracks">Banor</div>
  </nav>

  <!-- Models View -->
  <div id="view-models" class="view">
    <div id="models-list"></div>
    <div id="models-empty" class="empty-state hidden">
      <div class="empty-icon">🚗</div>
      <p>Inga modeller än. Lägg till din första!</p>
    </div>
  </div>

  <!-- Model Detail -->
  <div id="view-model-detail" class="view hidden">
    <div id="model-info-card"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0;">
      <h2>Setups <span id="setup-count-badge" class="card-badge">0</span></h2>
      <button class="btn btn-primary" onclick="showAddSetup()">+ Ny Setup</button>
    </div>
    <div id="setups-list"></div>
    <div id="setups-empty" class="empty-state hidden">
      <div class="empty-icon">⚙️</div>
      <p>Inga setups för denna modell än.</p>
    </div>
  </div>

  <!-- Add Model -->
  <div id="view-add-model" class="view hidden">
    <form id="form-add-model">
      <div class="form-group">
        <label>Namn</label>
        <input type="text" id="model-name" required placeholder="t.ex. RX8E 2026">
      </div>
      <div class="form-group">
        <label>Märke</label>
        <input type="text" id="model-brand" placeholder="t.ex. XRAY">
      </div>
      <div class="form-group">
        <label>Typ</label>
        <select id="model-type">
          <option value="On-Road">On-Road</option>
          <option value="Off-Road">Off-Road</option>
          <option value="Drift">Drift</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Spara Modell</button>
    </form>
  </div>

  <!-- Add Setup -->
  <div id="view-add-setup" class="view hidden">
    <form id="form-add-setup">
      <div class="form-group">
        <label>Setup-namn</label>
        <input type="text" id="setup-name" required placeholder="t.ex. Täby Basic">
      </div>
      <div class="form-group">
        <label>Bana</label>
        <select id="setup-track"><option value="">Välj bana...</option></select>
      </div>
      <div class="form-group">
        <label>Anteckningar</label>
        <textarea id="setup-notes" placeholder="Allmänna anteckningar..."></textarea>
      </div>

      <!-- ESC Section -->
      <div class="spec-table">
        <h3>⚡ ESC Inställningar</h3>
        <div class="form-group">
          <label>Running Mode</label>
          <select id="esc-running-mode">
            <option value="Forward/Brake">Forward/Brake</option>
            <option value="Forward/Reverse/Brake">Forward/Reverse/Brake</option>
            <option value="Direct F/R">Direct F/R</option>
          </select>
        </div>
        <div class="form-group">
          <label>Max Reverse Force (%)</label>
          <input type="number" id="esc-max-reverse-force" min="25" max="100" value="25">
        </div>
        <div class="form-group">
          <label>Cutoff Voltage</label>
          <select id="esc-cutoff-voltage">
            <option value="No Protection">No Protection</option>
            <option value="Auto (3.5V/cell)" selected>Auto (3.5V/cell)</option>
            <option value="5.0V">5.0V</option>
            <option value="9.6V">9.6V</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="esc-thermal-protection" checked> ESC Thermal Protection</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="esc-motor-thermal-protection" checked> Motor Thermal Protection</label>
        </div>
        <div class="form-group">
          <label>BEC Voltage</label>
          <select id="esc-bec-voltage">
            <option value="6.0V">6.0V</option>
            <option value="7.4V" selected>7.4V</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="esc-remote-off"> Remote Off</label>
        </div>
        <div class="form-group">
          <label>Sensor Mode</label>
          <select id="esc-sensor-mode">
            <option value="Full Sensored" selected>Full Sensored</option>
            <option value="Hybrid">Hybrid</option>
          </select>
        </div>
        <div class="form-group">
          <label>Motor Rotation</label>
          <select id="esc-motor-rotation">
            <option value="CCW" selected>CCW</option>
            <option value="CW">CW</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="esc-phase-ac-swap"> Phase-AC Swap</label>
        </div>
        <div class="form-group">
          <label>Punch SW Point (%)</label>
          <input type="number" id="esc-punch-sw-point" min="30" max="70" value="30">
        </div>
        <div class="form-group">
          <label>Punch Rate1 Start (1-30)</label>
          <input type="number" id="esc-punch-rate1-start" min="1" max="30" value="30">
        </div>
        <div class="form-group">
          <label>Punch Rate2 End (1-30)</label>
          <input type="number" id="esc-punch-rate2-end" min="1" max="30" value="30">
        </div>
        <div class="form-group">
          <label>Punch Line</label>
          <select id="esc-punch-line">
            <option value="Custom">Custom</option>
            <option value="Linear" selected>Linear</option>
          </select>
        </div>
        <div class="form-group">
          <label>Neutral Range (%)</label>
          <select id="esc-neutral-range">
            <option value="4">4%</option>
            <option value="6" selected>6%</option>
            <option value="8">8%</option>
            <option value="10">10%</option>
          </select>
        </div>
        <div class="form-group">
          <label>Initial Throttle Force (%)</label>
          <input type="number" id="esc-initial-throttle-force" min="1" max="15" value="3">
        </div>
        <div class="form-group">
          <label>Coast (%)</label>
          <input type="number" id="esc-coast" min="0" max="30" value="0">
        </div>
        <div class="form-group">
          <label>Softening Value (%)</label>
          <input type="number" id="esc-softening-value" min="0" max="30" value="20">
        </div>
        <div class="form-group">
          <label>Softening Range (%)</label>
          <input type="number" id="esc-softening-range" min="0" max="75" value="30">
        </div>
        <div class="form-group">
          <label>PWM Drive Freq</label>
          <select id="esc-pwm-drive-freq">
            <option value="Variable">Variable</option>
            <option value="1K">1K</option>
            <option value="4K" selected>4K</option>
            <option value="32K">32K</option>
          </select>
        </div>
        <div class="form-group">
          <label>Brake Control</label>
          <select id="esc-brake-control">
            <option value="Hard Brake" selected>Hard Brake</option>
            <option value="Soft Brake">Soft Brake</option>
          </select>
        </div>
        <div class="form-group">
          <label>Drag Brake (%)</label>
          <input type="number" id="esc-drag-brake" min="0" max="100" value="12">
        </div>
        <div class="form-group">
          <label>Max Brake Force (%)</label>
          <input type="number" id="esc-max-brake-force" min="0" max="100" value="70">
        </div>
        <div class="form-group">
          <label>Initial Brake Force</label>
          <select id="esc-initial-brake-force">
            <option value="0%">0%</option>
            <option value="Drag Brake" selected>Drag Brake</option>
          </select>
        </div>
        <div class="form-group">
          <label>Brake Rate Control (0-20)</label>
          <input type="number" id="esc-brake-rate-control" min="0" max="20" value="20">
        </div>
        <div class="form-group">
          <label>Brake Frequency</label>
          <select id="esc-brake-frequency">
            <option value="Variable">Variable</option>
            <option value="0.5K">0.5K</option>
            <option value="2K" selected>2K</option>
            <option value="16K">16K</option>
          </select>
        </div>
        <div class="form-group">
          <label>Boost Timing (°)</label>
          <input type="number" id="esc-boost-timing" min="0" max="48" value="16">
        </div>
        <div class="form-group">
          <label>Boost Start RPM</label>
          <input type="number" id="esc-boost-start-rpm" min="1000" max="20000" value="3000">
        </div>
        <div class="form-group">
          <label>Boost End RPM</label>
          <input type="number" id="esc-boost-end-rpm" min="8000" max="50000" value="25000">
        </div>
        <div class="form-group">
          <label>Boost Control</label>
          <select id="esc-boost-control">
            <option value="RPM">RPM</option>
            <option value="Auto" selected>Auto</option>
          </select>
        </div>
        <div class="form-group">
          <label>Turbo Timing (°)</label>
          <input type="number" id="esc-turbo-timing" min="0" max="48" value="38">
        </div>
        <div class="form-group">
          <label>Turbo Delay</label>
          <select id="esc-turbo-delay">
            <option value="Immediate">Immediate</option>
            <option value="0.05s">0.05s</option>
            <option value="0.1s" selected>0.1s</option>
            <option value="1s">1s</option>
          </select>
        </div>
        <div class="form-group">
          <label>Turbo Increase Rate</label>
          <select id="esc-turbo-increase-rate">
            <option value="Immediate">Immediate</option>
            <option value="18deg/0.1s" selected>18deg/0.1s</option>
            <option value="48deg/0.1s">48deg/0.1s</option>
          </select>
        </div>
        <div class="form-group">
          <label>Turbo Decrease Rate</label>
          <select id="esc-turbo-decrease-rate">
            <option value="Immediate">Immediate</option>
            <option value="21deg/0.1s" selected>21deg/0.1s</option>
            <option value="48deg/0.1s">48deg/0.1s</option>
          </select>
        </div>
        <div class="form-group">
          <label>ESC Anteckningar</label>
          <textarea id="esc-notes" placeholder="ESC-anteckningar..."></textarea>
        </div>
      </div>

      <!-- Chassi Section -->
      <div class="spec-table">
        <h3>🔧 Chassi</h3>
        <div class="form-group">
          <label>Ride Height Fram (mm)</label>
          <input type="number" id="ch-rh-f" step="0.1" value="8.0">
        </div>
        <div class="form-group">
          <label>Ride Height Bak (mm)</label>
          <input type="number" id="ch-rh-r" step="0.1" value="9.0">
        </div>
        <div class="form-group">
          <label>Camber Fram (°)</label>
          <input type="number" id="ch-cb-f" step="0.1" value="-2.0">
        </div>
        <div class="form-group">
          <label>Camber Bak (°)</label>
          <input type="number" id="ch-cb-r" step="0.1" value="-2.0">
        </div>
        <div class="form-group">
          <label>Toe Fram (°)</label>
          <input type="number" id="ch-to-f" step="0.1" value="1.5">
        </div>
        <div class="form-group">
          <label>Toe Bak (°)</label>
          <input type="number" id="ch-to-r" step="0.1" value="3.0">
        </div>
        <div class="form-group">
          <label>Caster Fram (°)</label>
          <input type="number" id="ch-ct-f" step="0.1" value="6.0">
        </div>
        <div class="form-group">
          <label>Shock Oil Fram</label>
          <input type="text" id="ch-sh-f" value="600">
        </div>
        <div class="form-group">
          <label>Shock Oil Bak</label>
          <input type="text" id="ch-sh-r" value="600">
        </div>
        <div class="form-group">
          <label>Shock Pos Fram</label>
          <input type="text" id="ch-sh-pos-f" value="2-DOT KIT">
        </div>
        <div class="form-group">
          <label>Shock Pos Bak</label>
          <input type="text" id="ch-sh-pos-r" value="3">
        </div>
        <div class="form-group">
          <label>Spring Fram</label>
          <input type="text" id="ch-sp-f" value="5.6">
        </div>
        <div class="form-group">
          <label>Spring Bak</label>
          <input type="text" id="ch-sp-r" value="5.0">
        </div>
        <div class="form-group">
          <label>Diff Fram</label>
          <input type="text" id="ch-df-f" value="7000">
        </div>
        <div class="form-group">
          <label>Diff Bak</label>
          <input type="text" id="ch-df-r" value="3000">
        </div>
        <div class="form-group">
          <label>Diff Center</label>
          <input type="text" id="ch-df-c" value="10000">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="ch-ar-f"> Anti-Roll Fram</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="ch-ar-r"> Anti-Roll Bak</label>
        </div>
        <div class="form-group">
          <label>Body Position</label>
          <input type="text" id="ch-bp" value="17">
        </div>
        <div class="form-group">
          <label>Body Height</label>
          <input type="text" id="ch-bh" value="2mm">
        </div>
        <div class="form-group">
          <label>Wing Height</label>
          <input type="text" id="ch-wh" value="10">
        </div>
        <div class="form-group">
          <label>Wing Angle (°)</label>
          <input type="number" id="ch-wa" value="0">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="ch-ad"> Aero Disk</label>
        </div>
        <div class="form-group">
          <label>Internal Ratio</label>
          <input type="text" id="ch-ir" value="3.31:1">
        </div>
        <div class="form-group">
          <label>Arm Mount Fram</label>
          <input type="text" id="ch-arm-f" value="A">
        </div>
        <div class="form-group">
          <label>Arm Mount Bak</label>
          <input type="text" id="ch-arm-r" value="D">
        </div>
        <div class="form-group">
          <label>Chassi Anteckningar</label>
          <textarea id="ch-notes"></textarea>
        </div>
      </div>

      <!-- Electronics Section -->
      <div class="spec-table">
        <h3>⚡ Elektronik</h3>
        <div class="form-group">
          <label>Motor</label>
          <input type="text" id="el-motor" value="Hobbywing 1900KV">
        </div>
        <div class="form-group">
          <label>Motor Timing</label>
          <input type="text" id="el-motor-timing" value="0°">
        </div>
        <div class="form-group">
          <label>Servo</label>
          <input type="text" id="el-servo" value="Savox 1252MG">
        </div>
        <div class="form-group">
          <label>Receiver</label>
          <input type="text" id="el-rx" value="Sanwa RX-482">
        </div>
        <div class="form-group">
          <label>Batteri</label>
          <input type="text" id="el-batt" value="2S 6000mAh 100C">
        </div>
      </div>

      <!-- Tires Section -->
      <div class="spec-table">
        <h3>🛞 Däck</h3>
        <div class="form-group">
          <label>Märke</label>
          <input type="text" id="tire-brand" value="Pro-Line">
        </div>
        <div class="form-group">
          <label>Modell</label>
          <input type="text" id="tire-model" value="Blockade">
        </div>
        <div class="form-group">
          <label>Compound</label>
          <input type="text" id="tire-compound" value="M3">
        </div>
        <div class="form-group">
          <label>Insert</label>
          <input type="text" id="tire-insert" value="Closed Cell">
        </div>
        <div class="form-group">
          <label>Lim-status</label>
          <select id="tire-glue">
            <option value="Fresh" selected>Fresh</option>
            <option value="OK">OK</option>
            <option value="Old">Old</option>
          </select>
        </div>
        <div class="form-group">
          <label>Slitage</label>
          <select id="tire-wear">
            <option value="Nya" selected>Nya</option>
            <option value="Lite">Lite</option>
            <option value="Mycket">Mycket</option>
          </select>
        </div>
        <div class="form-group">
          <label>Däck Anteckningar</label>
          <textarea id="tire-notes"></textarea>
        </div>
      </div>

      <!-- Rating -->
      <div class="form-group">
        <label>Betyg</label>
        <div class="rating-input">

// ===== NAVIGATION =====
function showView(viewName) {
  console.log('showView called:', viewName);
  
  document.querySelectorAll('.view').forEach(v => {
    v.classList.add('hidden');
    console.log('Hiding view:', v.id);
  });
  
  const targetView = document.getElementById('view-' + viewName);
  if (targetView) {
    targetView.classList.remove('hidden');
    console.log('Showing view:', 'view-' + viewName);
  } else {
    console.error('View not found:', 'view-' + viewName);
    return;
  }

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navBtn = document.querySelector(`.nav-item[data-view="${viewName}"]`);
  if (navBtn) navBtn.classList.add('active');

  const titleMap = {
    'models': 'RC Setup Tracker',
    'add-model': 'Ny Modell',
    'model-detail': 'Modell',
    'add-setup': 'Ny Setup',
    'setup-detail': 'Setup',
    'compare': 'Jämför',
    'tracks': 'Banor',
    'add-track': 'Ny Bana',
    'all-setups': 'Alla Setups'
  };
  document.getElementById('page-title').textContent = titleMap[viewName] || 'RC Setup Tracker';

  document.getElementById('back-btn').classList.toggle('hidden',
    ['models','compare','tracks','all-setups'].includes(viewName));
  document.getElementById('add-btn').classList.toggle('hidden',
    viewName !== 'models');

  if (viewName === 'models') renderModels();
  if (viewName === 'all-setups') renderAllSetups();
  if (viewName === 'tracks') renderTracks();
  if (viewName === 'compare') initCompare();
  if (viewName === 'model-detail') renderModelDetail(currentModelId);
  if (viewName === 'setup-detail') renderSetupDetail(currentSetupId);
  if (viewName === 'add-setup') initAddSetup();

  window.scrollTo(0, 0);
}

document.getElementById('back-btn').onclick = () => {

  const backMap = {
    'add-model': 'models',
    'model-detail': 'models',
    'add-setup': 'model-detail',
    'setup-detail': 'model-detail',
    'add-track': 'tracks'
  };
  showView(backMap[view] || 'models');
};

document.getElementById('add-btn').onclick = () => showView('add-model');

// ===== MODELS =====
function renderModels() {
  const models = DB.get('models').sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
  const setups = DB.get('setups');
  const list = document.getElementById('models-list');
  const empty = document.getElementById('models-empty');

  if (!models.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  list.innerHTML = models.map(m => {
    const count = setups.filter(s => s.modelId === m.id).length;
    return `
      <div class="card" onclick="openModel('${m.id}')">
        <div class="card-row">
          <div class="card-icon">🚗</div>
          <div class="card-body">
            <div class="card-title">${esc(m.name)}</div>
            <div class="card-subtitle">${esc(m.brand)} · ${esc(m.type)}</div>
            ${count ? `<div class="card-badge">${count} setup${count > 1 ? 's' : ''}</div>` : ''}

// ===== MODEL DETAIL =====
function renderModelDetail(id) {
  const models = DB.get('models');
  const model = models.find(m => m.id === id);
  if (!model) return showView('models');

  const setups = DB.get('setups').filter(s => s.modelId === id).sort((a, b) => new Date(b.date) - new Date(a.date));

  document.getElementById('model-info-card').innerHTML = `
    <div class="card-row">
      <div class="card-icon">🚗</div>
      <div class="card-body">
        <div class="card-title">${esc(model.name)}</div>
        <div class="card-subtitle">${esc(model.brand)} · ${esc(model.type)}</div>

      </div>
    </div>
    ${model.setupSheet ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><img src="${esc(model.setupSheet)}" style="width:100%;border-radius:8px;cursor:pointer;" onclick="window.open('${esc(model.setupSheet)}','_blank')"><div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;text-align:center;">Setup Sheet - klicka för full storlek</div></div>` : ''}

// ===== SETUP SHEET UPLOAD =====
function handleSetupSheetUpload(input, modelId) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    const models = DB.get('models');
    const model = models.find(m => m.id === modelId);
    if (model) {
      model.setupSheet = dataUrl;
      DB.set('models', models);
      renderModelDetail(modelId);
    }
  };
  reader.readAsDataURL(file);
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
}

      ['Slutposition', s.rtFinal || '-']
    ])}

    ${specTable('🌡️ Förhållanden', [
      ['Bantemp', (s.trTemp || '-') + '°C'], ['Lufttemp', (s.trAir || '-') + '°C'],
      ['Luftfuktighet', (s.trHum || '-') + '%']
    ])}

    ${specTable('🛞 Däck', [
      ['Märke', s.tireBrand || '-'], ['Modell', s.tireModel || '-'],
      ['Compound', s.tireCompound || '-'], ['Insert', s.tireInsert || '-'],
      ['Lim-status', s.tireGlue || '-'], ['Slitage', s.tireWear || '-'],
      ['Anteckningar', s.tireNotes || '-']
    ])}

    <div class="action-bar">
      <button class="btn btn-secondary" onclick="editSetup('${s.id}')">✏️ Redigera</button>
      <button class="btn btn-danger" onclick="deleteSetup('${s.id}')">🗑️ Ta bort</button>
    </div>
    <div style="height:40px;"></div>
  `;
}

function specTable(title, specs) {
  const rows = specs.filter(([_, v]) => v !== '' && v !== undefined && v !== null && v !== '-')
    .map(([k, v]) => `<div class="spec-row"><span class="spec-label">${esc(k)}</span><span class="spec-value">${esc(String(v))}</span></div>`).join('');
  if (!rows) return '';
  return `<div class="spec-table"><h3>${esc(title)}</h3>${rows}</div>`;
}

// ===== ESC CONFIG IMPORT =====
function importESCConfig() {
  document.getElementById('esc-config-input').click();
}

function handleESCConfigImport(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const config = parseESCConfig(e.target.result);
      applyESCConfig(config);
      alert('ESC-konfiguration importerad framgångsrikt!');
    } catch (err) {
      alert('Fel vid import: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function parseESCConfig(text) {
  const config = {};
  const lines = text.split('\n');
  
  // Hitta enhetsinfo
  const deviceMatch = text.match(/Device Type:\s*(.+)/);
  const hwMatch = text.match(/硬件版本\.:\s*(.+)/);
  const fwMatch = text.match(/Firmware Version:\s*(.+)/);
  const modeMatch = text.match(/Mode:\s*(.+)/);
  const nameMatch = text.match(/Name:\s*(.+)/);
  
  if (deviceMatch) config.deviceType = deviceMatch[1].trim();
  if (hwMatch) config.hwVersion = hwMatch[1].trim();
  if (fwMatch) config.fwVersion = fwMatch[1].trim();
  if (modeMatch) config.mode = modeMatch[1].trim();
  if (nameMatch) config.name = nameMatch[1].trim();
  
  // Parse numrerade inställningar
  const settingRegex = /(\d+)\.\[([^\]]+)\]\s*\n\s*([^\n]+)\n\s*\(\*\)\(\+\)/g;
  let match;
  while ((match = settingRegex.exec(text)) !== null) {
    const num = parseInt(match[1]);
    const name = match[2].trim();
    const value = match[3].trim();
    config[name] = value;
  }
  
  // Om regex inte fungerar, försök alternativ parsing
  if (Object.keys(config).length <= 5) {
    // Alternativ parsing för kinesiska filer
    const altRegex = /(\d+)\.\[([^\]]+)\]\s*\n\s*([^\n]+)(?:\n\s*\(\*\)\(\+\))?/g;
    while ((match = altRegex.exec(text)) !== null) {
      const name = match[2].trim();
      const value = match[3].trim();
      config[name] = value;
    }
  }
  
  return config;
}

function applyESCConfig(config) {
  // Mappa konfigurationsvärden till formulärfält
  const mapping = {
    'Running Mode': { field: 'esc-running-mode', type: 'select' },
    'Max.ReverseForce': { field: 'esc-max-reverse-force', type: 'number' },

    'Coast': { field: 'esc-coast', type: 'number' },
    'Softening Value': { field: 'esc-softening-value', type: 'number' },
    'Softening Range': { field: 'esc-softening-range', type: 'number' },
    'PWM Drive Freq': { field: 'esc-pwm-drive-freq', type: 'select' },
    'Brake Control': { field: 'esc-brake-control', type: 'select' },
    'Drag Brake': { field: 'esc-drag-brake', type: 'number' },
    'Max.Brake Force': { field: 'esc-max-brake-force', type: 'number' },
    'Initial Brake Force': { field: 'esc-initial-brake-force', type: 'select' },
    'Brake Rate Control': { field: 'esc-brake-rate-control', type: 'number' },
    'Brake Frequency': { field: 'esc-brake-frequency', type: 'select' },
    'Boost Timing': { field: 'esc-boost-timing', type: 'number' },
    'Boost Start RPM': { field: 'esc-boost-start-rpm', type: 'number' },
    'Boost End RPM': { field: 'esc-boost-end-rpm', type: 'number' },
    'Boost Control': { field: 'esc-boost-control', type: 'select' },
    'Turbo Timing': { field: 'esc-turbo-timing', type: 'number' },
    'Turbo Delay': { field: 'esc-turbo-delay', type: 'select' },
    'Turbo Increase Rate': { field: 'esc-turbo-increase-rate', type: 'select' },
    'Turbo Decrease Rate': { field: 'esc-turbo-decrease-rate', type: 'select' }
  };
  
  // Värdemappningar för speciella fall
  const valueMappings = {
    'Running Mode': {
      '正转带刹车': 'Forward/Brake',
      '正反转带刹车': 'Forward/Reverse/Brake',
      '直接正反转': 'Direct F/R'
    },
    'Cutoff Voltage': {
      '不保护': 'No Protection',
      '自动(3.5V/节)': 'Auto (3.5V/cell)'
    },
    'ESC Thermal Protection': {
      '不保护': false,
      '保护': true
    },
    'Motor Thermal Protection': {
      '不保护': false,
      '保护': true
    },
    'BEC Voltage': {
      '6.0V': '6.0V',
      '7.4V': '7.4V'
    },
    'Remote Off': {
      '关闭': false,
      '打开': true
    },
    'Sensor Mode': {
      '全有感模式': 'Full Sensored',
      '有感/无感混合模式': 'Hybrid'
    },
    'Motor Rotation': {
      '逆时针': 'CCW',
      '顺时针': 'CW'
    },
    'Phase-AC Swap': {
      '关闭': false,
      '打开': true
    },
    'Punch Line': {
      '自定义': 'Custom',
      '线性': 'Linear'
    },
    'PWM Drive Freq': {
      '变频': 'Variable',
      '4K': '4K'
    },
    'Brake Control': {
      '重刹车': 'Hard Brake',

    },

      '等于拖刹力度': 'Drag Brake',
      'Drag Brake': 'Drag Brake'
    },

      '变频': 'Variable',
      '2K': '2K'
    },

      '转速': 'RPM',
      '自动': 'Auto'
    },

      '0.1s': '0.1s'
    },

    },
    'Turbo Decrease Rate': {
      '立即执行': 'Immediate',
      '21deg/0.1s': '21deg/0.1s'
    }
  };
  
  // Applicera värden
  for (const [configName, fieldInfo] of Object.entries(mapping)) {
    const value = config[configName];
    if (value === undefined) continue;
    
    const element = document.getElementById(fieldInfo.field);
    if (!element) continue;
    
    // Hämta mappat värde om det finns
    let mappedValue = value;
    if (valueMappings[configName] && valueMappings[configName][value] !== undefined) {
      mappedValue = valueMappings[configName][value];
    }
    
    // Sätt värde baserat på fälttyp
    if (fieldInfo.type === 'checkbox') {
      element.checked = Boolean(mappedValue);
    } else if (fieldInfo.type === 'number') {
      // Extrahera numeriskt värde
      const numMatch = String(mappedValue).match(/(\d+(?:\.\d+)?)/);
      element.value = numMatch ? numMatch[1] : mappedValue;
    } else {
      element.value = mappedValue;
    }
  }
  
  // Uppdatera anteckningar med enhetsinfo
  const notesField = document.getElementById('esc-notes');

function renderAllSetups() {
  const filter = document.getElementById('setup-filter').value;
  const search = document.getElementById('setup-search').value.toLowerCase();
  let setups = DB.get('setups');

  if (filter === 'favorites') setups = setups.filter(s => s.isFavorite);
  if (filter === 'best') setups = setups.filter(s => s.performanceRating >= 4);
  if (filter === 'recent') setups = setups.slice(0, 10);
  if (search) setups = setups.filter(s =>
    s.name.toLowerCase().includes(search) ||
    (s.modelName && s.modelName.toLowerCase().includes(search)) ||
    (s.modelBrand && s.modelBrand.toLowerCase().includes(search))
  );

  setups.sort((a, b) => new Date(b.date) - new Date(a.date));
  const models = DB.get('models');
  setups = setups.map(s => {
    const m = models.find(x => x.id === s.modelId);
    return { ...s, modelName: m?.name, modelBrand: m?.brand };
  });

  const list = document.getElementById('all-setups-list');
  if (!setups.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">⚙️</div><p>Inga setups hittades</p></div>`;
    return;
  }
  list.innerHTML = setups.map(s => setupRowHTML(s, false)).join('');
}

document.getElementById('setup-search').oninput = renderAllSetups;
document.getElementById('setup-filter').onchange = renderAllSetups;

// ===== COMPARE =====
function initCompare() {
  const models = DB.get('models');
  const sel = document.getElementById('compare-model');
  sel.innerHTML = '<option>Välj modell...</option>' +
    models.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  sel.onchange = () => loadCompareSetups(sel.value);
}

function loadCompareSetups(modelId) {
  const setups = DB.get('setups').filter(s => s.modelId === modelId);
  const s1 = document.getElementById('compare-setup-1');
  const s2 = document.getElementById('compare-setup-2');
  const html = setups.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  s1.innerHTML = '<option>Setup 1...</option>' + html;
  s2.innerHTML = '<option>Setup 2...</option>' + html;
}

function doCompare() {
  const id1 = document.getElementById('compare-setup-1').value;
  const id2 = document.getElementById('compare-setup-2').value;
  if (!id1 || !id2 || id1 === id2) {
    document.getElementById('compare-results').innerHTML = '<div class="empty-state"><p>Välj två olika setups</p></div>';
    return;
  }
  const s1 = DB.get('setups').find(s => s.id === id1);
  const s2 = DB.get('setups').find(s => s.id === id2);

  const sections = [
    { title: 'ESC', fields: [
      ['Running Mode', 'escRunningMode'], ['Max Reverse Force', 'escMaxReverseForce'],
      ['Cutoff Voltage', 'escCutoffVoltage'], ['BEC Voltage', 'escBECVoltage'],
      ['Sensor Mode', 'escSensorMode'], ['Motor Rotation', 'escMotorRotation'],
      ['Punch SW Point', 'escPunchSWPoint'], ['Punch Line', 'escPunchLine'],
      ['Neutral Range', 'escNeutralRange'], ['PWM Drive Freq', 'escPWMDriveFreq'],
      ['Brake Control', 'escBrakeControl'], ['Drag Brake', 'escDragBrake'],
      ['Max Brake Force', 'escMaxBrakeForce'], ['Brake Frequency', 'escBrakeFrequency'],
      ['Boost Timing', 'escBoostTiming'], ['Boost Start RPM', 'escBoostStartRPM'],
      ['Boost End RPM', 'escBoostEndRPM'], ['Boost Control', 'escBoostControl'],
      ['Turbo Timing', 'escTurboTiming'], ['Turbo Delay', 'escTurboDelay'],
      ['Turbo Increase Rate', 'escTurboIncreaseRate'], ['Turbo Decrease Rate', 'escTurboDecreaseRate']
    ]},
    { title: 'Chassi', fields: [
      ['Ride Height F', 'chRhF'], ['Ride Height B', 'chRhR'],
      ['Camber F', 'chCbF'], ['Camber B', 'chCbR'],
      ['Toe F', 'chToF'], ['Toe B', 'chToR'],
      ['Shock F', 'chShF'], ['Shock B', 'chShR'],
      ['Spring F', 'chSpF'], ['Spring B', 'chSpR'],
      ['Diff F', 'chDfF'], ['Diff B', 'chDfR'], ['Diff C', 'chDfC'],
      ['AR F', 'chArF'], ['AR B', 'chArR']
    ]},
    { title: 'Däck', fields: [
      ['Märke', 'tireBrand'], ['Modell', 'tireModel'],
      ['Compound', 'tireCompound'], ['Insert', 'tireInsert'],
      ['Glue', 'tireGlue'], ['Wear', 'tireWear']
    ]}
  ];

  let html = '';
  sections.forEach(sec => {
    const rows = sec.fields.map(([label, key]) => {
      const v1 = String(s1[key] ?? '-');
      const v2 = String(s2[key] ?? '-');
      const diff = v1 !== v2 ? ' diff' : '';
      return `<div class="compare-row${diff}">
        <div><div class="compare-setup-name" style="color:var(--accent);">${esc(s1.name)}</div><div>${esc(v1)}</div></div>
        <div style="text-align:right;"><div class="compare-setup-name" style="color:var(--accent-light);">${esc(s2.name)}</div><div>${esc(v2)}</div></div>
      </div>`;
    }).join('');
    html += `<div class="compare-section"><h3>${esc(sec.title)}</h3>${rows}</div>`;
  });

  document.getElementById('compare-results').innerHTML = html;
}

document.getElementById('compare-setup-1').onchange = doCompare;
document.getElementById('compare-setup-2').onchange = doCompare;

// ===== TRACKS =====
function renderTracks() {
  const tracks = DB.get('tracks').sort((a, b) => a.name.localeCompare(b.name));
  const list = document.getElementById('tracks-list');
  const empty = document.getElementById('tracks-empty');

  if (!tracks.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  list.innerHTML = tracks.map(t => {
    const setupCount = DB.get('setups').filter(s => s.trackId === t.id).length;
    return `
      <div class="card">
        <div class="card-row">
          <div class="card-icon">🏁</div>
          <div class="card-body">
            <div class="card-title">${esc(t.name)}</div>
            ${t.location ? `<div class="card-subtitle">${esc(t.location)}</div>` : ''}
            ${t.surface ? `<div class="card-badge">${esc(t.surface)}</div>` : ''}
          </div>
          ${setupCount ? `<div style="font-size:0.75rem;color:var(--text-muted);padding:4px 10px;background:var(--bg-card-hover);border-radius:8px;">${setupCount}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// Add track
document.getElementById('form-add-track').onsubmit = (e) => {
  e.preventDefault();
  const track = {
    id: DB.uid(),
    name: document.getElementById('track-name').value.trim(),
    location: document.getElementById('track-location').value.trim(),
    surface: document.getElementById('track-surface').value,
    notes: document.getElementById('track-notes').value.trim()
  };
  DB.set('tracks', [...DB.get('tracks'), track]);
  document.getElementById('form-add-track').reset();
  showView('tracks');
  updateStats();
};

// ===== STATS =====
function updateStats() {
  document.getElementById('stat-models').textContent = DB.get('models').length;
  document.getElementById('stat-setups').textContent = DB.get('setups').length;
  document.getElementById('stat-tracks').textContent = DB.get('tracks').length;
}

// ===== UTILS =====
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ===== INIT =====
loadState();
showView('models');

// Navigation click handlers - FIX: Use addEventListener instead of onclick
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', function() {
    const view = this.dataset.view;
    console.log('Nav clicked:', view);
    
    // Update nav active state
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    this.classList.add('active');
    
    // Show the correct view
    console.log('Nav clicked, showing view:', view);
    if (view === 'models') {
      showView('models');
    } else if (view === 'all-setups') {
      showView('all-setups');
    } else if (view === 'compare') {
      showView('compare');
    } else if (view === 'tracks') {
      showView('tracks');
    }
  });
});
</script>
